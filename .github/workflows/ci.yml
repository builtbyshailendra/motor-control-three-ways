name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: install
        run: pip install -r requirements.txt
      - name: tests
        run: python -m pytest -q
      - name: step 1 (python-control)
        run: python scripts/step1_design.py
